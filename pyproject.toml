[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azik-typing"
version = "0.1.0"
description = "Console typing practice tool for SKK/AZIK input method"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["azik", "skk", "typing", "japanese", "ime"]

[project.scripts]
azik-typing = "azik_typing.main:main"

[tool.hatch.build.targets.wheel]
packages = ["azik_typing"]

[tool.hatch.build.targets.wheel.force-include]
"azik_typing/sentences.txt" = "azik_typing/sentences.txt"
